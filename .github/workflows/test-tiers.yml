name: test-tiers

on:
  push:
    branches: [main, master, "feat/**", "fix/**", "refactor/**"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hermetic-tests:
    name: ${{ matrix.tier }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        tier: [l0, l1, l2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test package
        run: python -m pip install ".[test]"
      - name: Run ${{ matrix.tier }} tests
        run: python -m pytest tests/ -m "${{ matrix.tier }}" --timeout=30 --tb=short -q
      - name: Audit extension parity
        if: matrix.tier == 'l0'
        run: python scripts/audit_extension_parity.py

  frontend-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web/floor-plan-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/floor-plan-ui/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
