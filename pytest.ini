[pytest]
testpaths = tests
markers =
    l0: Unit tests — no external dependencies required
    l1: Service tests — FastAPI test client, mocked LLM/Kit
    l2: MCP tests — MCP server protocol tests
    l3: Integration tests — requires running Isaac Sim + Kit RPC
    slow: Tests that take >5 seconds
    compliance_e2e: CRM-T3 — opt-in peg-insert E2E (live Kit RPC smoke + admittance vs rigid baseline)
    gemini_live: Opt-in live Gemini Flash smoke (real API call, ~5k tokens per run, kill switch GEMINI_SMOKE_DISABLED=1)
asyncio_mode = auto
# Safe local default: exercise all hermetic tiers while keeping live systems opt-in.
# CI selects l0/l1/l2 explicitly so failures identify the affected boundary.
addopts = -m "not l3 and not compliance_e2e and not gemini_live" --tb=short -q
